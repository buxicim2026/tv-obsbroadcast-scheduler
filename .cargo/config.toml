# Per-workspace cargo config.
#
# IMPORTANT: do NOT set a global `build.target` here.
#
# A `build.target` in a project-level .cargo/config.toml applies to *every*
# platform, so pinning `x86_64-pc-windows-gnu` would make Linux/macOS runners
# (and CI) look for the Windows GNU std and fail with
#   error[E0463]: can't find crate for `core`
#
# Each platform should just use its host toolchain. Windows developers who
# prefer MinGW-w64 over MSVC can opt in per-shell, e.g.:
#   $env:CARGO_BUILD_TARGET = "x86_64-pc-windows-gnu"     (PowerShell)
#   set CARGO_BUILD_TARGET=x86_64-pc-windows-gnu          (cmd)
# or pass `--target x86_64-pc-windows-gnu` explicitly. See docs/README.md.
