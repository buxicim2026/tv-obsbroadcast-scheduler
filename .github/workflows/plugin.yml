name: Build OBS script package

# Packages the OBS Lua script frontend together with the Rust engine binary.
#
# The frontend is an OBS *script* (Lua), not a native binary module, so this
# job needs no OBS SDK headers, no cmake, no obs.lib synthesis — it just
# copies the .lua plus the engine binary into a zip/tar.gz.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  script:
    name: script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            archive: linux-x64
          - os: windows-2022
            archive: windows-x64
          # Intel macOS (macos-13) is skipped: the free-tier runner queue is
          # hours deep. The Lua script itself is portable; only the engine
          # binary is arch-specific, so add macos-13 back when available.
          - os: macos-14
            archive: macos-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust engine
        run: cargo build --release --manifest-path engine/Cargo.toml

      - name: Assemble script bundle
        shell: bash
        run: |
          # Layout the user gets after unzipping:
          #   tv_obsbroadcast_scheduler.lua      <- load this in OBS
          #   engine/tv-obsbroadcast-scheduler*  <- spawned by the script
          OUT="dist/tv-obsbroadcast-scheduler"
          rm -rf "$OUT"
          mkdir -p "$OUT/engine"
          cp obs-script/tv_obsbroadcast_scheduler.lua "$OUT/"
          cp plugin-c-legacy/data/locale/*.ini "$OUT/locale/" 2>/dev/null || true
          # engine/ is a workspace member, so cargo writes to <repo>/target/release/
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            cp target/release/tv-obsbroadcast-scheduler.exe "$OUT/engine/"
            (cd dist && 7z a "tv-obsbroadcast-scheduler-${{ matrix.archive }}.zip" "tv-obsbroadcast-scheduler")
          else
            cp target/release/tv-obsbroadcast-scheduler "$OUT/engine/"
            (cd dist && tar czf "tv-obsbroadcast-scheduler-${{ matrix.archive }}.tar.gz" "tv-obsbroadcast-scheduler")
          fi
          find "$OUT" -type f | sort

      - name: Upload script artifact
        uses: actions/upload-artifact@v4
        with:
          name: script-${{ matrix.archive }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    name: publish script packages
    needs: script
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ startsWith(github.ref, 'refs/tags/v0.') || contains(github.ref_name, '-') }}
