name: Release engine binaries

# Only on v* tags (or manual dispatch). Day-to-day "does it compile?"
# verification is ci.yml's job — that one is much faster (cargo check, no
# LTO) and runs on every push / PR. Publishing is gated on the tag ref by the
# `release` job below.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Both release workflows (engine binaries + script package) publish to the
# SAME GitHub release. Without this they race, and softprops/action-gh-release
# fails with "Too many retries" on the concurrent asset uploads.
concurrency:
  group: publish-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: linux-arm64
          # Intel macOS (x86_64-apple-darwin) needs the macos-13 runner, whose
          # free-tier queue is extremely long; re-added once GitHub's macOS
          # runner availability improves (tracked in README).
          - target: aarch64-apple-darwin
            os: macos-14
            archive: macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            archive: windows-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            target
          key: cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      # Cross-compiling to aarch64-unknown-linux-gnu on an x86_64 runner
      # needs a *complete* aarch64 toolchain: gcc + libc dev headers +
      # ar. gcc-aarch64-linux-gnu alone is not enough because many crates
      # pull in C deps whose build scripts need libc headers and use the
      # CC / AR env vars (cc-rs), not the cargo _LINKER variable.
      - name: Install Linux cross toolchain (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross

      - name: Build engine
        run: cargo build --release --manifest-path engine/Cargo.toml --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar

      - name: Package artifacts
        shell: bash
        run: |
          # Prefix with "engine-" so these stay clearly distinguishable from
          # the plugin bundles built by plugin.yml.
          mkdir -p out/${{ matrix.archive }}
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            cp target/${{ matrix.target }}/release/tv-obsbroadcast-scheduler.exe out/${{ matrix.archive }}/
            (cd out && 7z a engine-${{ matrix.archive }}.zip ${{ matrix.archive }}/*) || \
            (cd out && zip -r engine-${{ matrix.archive }}.zip ${{ matrix.archive }}/)
          else
            cp target/${{ matrix.target }}/release/tv-obsbroadcast-scheduler out/${{ matrix.archive }}/
            (cd out && tar czf engine-${{ matrix.archive }}.tar.gz ${{ matrix.archive }}/)
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.archive }}
          # Archives are named engine-<archive>.* by the packaging step above.
          path: out/engine-${{ matrix.archive }}.*

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          # Pre-release for 0.x tags and any pre-release suffix (v1.0.0-rc.1)
          prerelease: ${{ startsWith(github.ref, 'refs/tags/v0.') || contains(github.ref_name, '-') }}
