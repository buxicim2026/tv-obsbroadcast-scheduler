[workspace]
resolver = "2"
members = ["engine"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
authors = ["tv-obsbroadcast-scheduler contributors"]
license = "MIT"
repository = "https://github.com/yourname/tv-obsbroadcast-scheduler"
description = "OBS Studio plugin: TV-style broadcast scheduler. Auto-swap media source file at millisecond precision."

[workspace.dependencies]
# Runtime / async
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs", "net", "io-util"] }
tokio-tungstenite = { version = "0.23", features = ["native-tls"] }
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"

# HTTP / WebSocket server (admin + overlay + OBS dock proxy + bootstrap)
axum = { version = "0.7", features = ["ws", "macros", "http1", "tokio"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "trace", "cors", "set-header"] }
http = "1.1"
http-body-util = "0.1"
bytes = "1.7"

# Serialization / config / persistence
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"

# Logging / CLI
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1"
thiserror = "1"

# Misc
once_cell = "1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"

# Embed dist/ (admin + overlay + default config.json) into the engine binary
# at compile time so the engine distributable is a SINGLE file.
include_dir = "0.7"

# WebSocket text framing helpers
tungstenite = "0.23"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
incremental = false
debug = 0
